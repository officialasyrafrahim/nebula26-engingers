name: Test

on:
  push:
    branches: [main, devel]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[dev,solver]"
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Test backend
        working-directory: backend
        run: python -m pytest -q
      - name: Validate published sample
        working-directory: backend
        run: >-
          python -c "from app.modules.validator import validate_directories as v;
          r = v('../data/public-instance', '../data/submission-sample');
          print(r.model_dump_json(indent=2));
          raise SystemExit(0 if r.ready_for_submission else 1)"
      - name: Generate and validate public A/B/C answers (mandatory smoke)
        run: >-
          python scripts/generate_public_answers.py
          --profile smoke
          --outdir dist/public-answers-smoke
          --format both

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
