name: Test

on:
  push:
    branches: [main, devel]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[dev,solver]"
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Test backend
        working-directory: backend
        run: python -m pytest -q
      - name: Validate published sample
        working-directory: backend
        run: >-
          python -c "from app.modules.validator import validate_directories as v;
          r = v('../data/public-instance', '../data/submission-sample');
          print(r.model_dump_json(indent=2));
          raise SystemExit(0 if r.ready_for_submission else 1)"
      - name: Generate and validate public A/B/C answers (mandatory smoke)
        run: >-
          python scripts/generate_public_answers.py
          --profile smoke
          --outdir dist/public-answers-smoke
          --format both

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser e2e suite
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: frontend/e2e/.artifacts
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: docker compose -f deploy/docker-compose.yml config
      - name: Build production frontend image
        run: docker build -t rao-web:ci frontend
