name: Feature governance

on:
  push:
    branches: [main]
    paths:
      - "docs/team/feature-registry.json"
      - ".github/labels.json"
      - "scripts/features.py"
      - "scripts/check_pr_governance.py"
      - ".github/workflows/feature-governance.yml"
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate feature registry
        run: python3 scripts/features.py validate
      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${GITHUB_BASE_REF}:docs/team/feature-registry.json" > "$RUNNER_TEMP/base-feature-registry.json"
          python3 scripts/check_pr_governance.py "$GITHUB_EVENT_PATH" --base-registry "$RUNNER_TEMP/base-feature-registry.json"
