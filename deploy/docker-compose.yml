# TODO(DEP-01): single-site low-cost deployment; scale path in docs/design/skeleton-design.md
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmis}
      POSTGRES_DB: ${POSTGRES_DB:-rmis}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rmis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rmis-secret}
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../backend
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      RMIS_DATABASE_URL: postgresql+psycopg://rmis:rmis@db:5432/rmis
      RMIS_REDIS_URL: redis://redis:6379/0
      RMIS_S3_ENDPOINT_URL: http://minio:9000
      RMIS_START_INPROCESS_WORKER: "false"
      RMIS_ASSISTANT_LLM_ENABLED: ${RMIS_ASSISTANT_LLM_ENABLED:-false}
      RMIS_ASSISTANT_LLM_BASE_URL: ${RMIS_ASSISTANT_LLM_BASE_URL:-https://api.openai.com/v1}
      RMIS_ASSISTANT_LLM_API_KEY: ${RMIS_ASSISTANT_LLM_API_KEY:-}
      RMIS_ASSISTANT_LLM_API_KEY_REQUIRED: ${RMIS_ASSISTANT_LLM_API_KEY_REQUIRED:-true}
      RMIS_ASSISTANT_LLM_MODEL: ${RMIS_ASSISTANT_LLM_MODEL:-gpt-4o-mini}
      RMIS_ASSISTANT_LLM_TIMEOUT_SECONDS: ${RMIS_ASSISTANT_LLM_TIMEOUT_SECONDS:-10}
      RMIS_ASSISTANT_LLM_MAX_TOKENS: ${RMIS_ASSISTANT_LLM_MAX_TOKENS:-500}
      RMIS_ASSISTANT_LLM_SEND_TEMPERATURE: ${RMIS_ASSISTANT_LLM_SEND_TEMPERATURE:-true}
      RMIS_ASSISTANT_LLM_TEMPERATURE: ${RMIS_ASSISTANT_LLM_TEMPERATURE:-0}
      RMIS_ASSISTANT_LLM_TOKEN_LIMIT_PARAMETER: ${RMIS_ASSISTANT_LLM_TOKEN_LIMIT_PARAMETER:-max_tokens}
      RMIS_ASSISTANT_LLM_MAX_CONTEXT_CHARS: ${RMIS_ASSISTANT_LLM_MAX_CONTEXT_CHARS:-24000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  solver-worker:
    build:
      context: ../backend
    command: python -m app.workers.solver_worker
    environment:
      RMIS_DATABASE_URL: postgresql+psycopg://rmis:rmis@db:5432/rmis
      RMIS_REDIS_URL: redis://redis:6379/0
      RMIS_S3_ENDPOINT_URL: http://minio:9000
      RMIS_START_INPROCESS_WORKER: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db-data:
  redis-data:
  minio-data:
