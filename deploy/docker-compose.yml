name: rao

# Single-site stack for Rail Access Optimisation.
# PostgreSQL 16 + Redis 7 + API + rail solver worker + web.
# There is no TimescaleDB and no MinIO: none of the rail pipeline needs them.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rao}
      POSTGRES_DB: ${POSTGRES_DB:-rao}
    volumes:
      - rao-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rao} -d ${POSTGRES_DB:-rao}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rao-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../backend
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      RAO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rao}:${POSTGRES_PASSWORD:-rao}@db:5432/${POSTGRES_DB:-rao}
      RAO_REDIS_URL: redis://redis:6379/0
      RAO_QUEUE_BACKEND: redis
      RAO_QUEUE_NAME: ${RAO_QUEUE_NAME:-rao:jobs}
      RAO_START_INPROCESS_WORKER: "false"
      RAO_WORKER_POLL_SECONDS: ${RAO_WORKER_POLL_SECONDS:-1.0}
      RAO_SOLVER_TIME_LIMIT_SECONDS: ${RAO_SOLVER_TIME_LIMIT_SECONDS:-300}
      RAO_SOLVER_SEED: ${RAO_SOLVER_SEED:-42}
      RAO_HORIZON_EXTENSION_WEEKS: ${RAO_HORIZON_EXTENSION_WEEKS:-6}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  rail-solver-worker:
    build:
      context: ../backend
    command: python -m app.workers.rail_solver_worker
    environment:
      RAO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rao}:${POSTGRES_PASSWORD:-rao}@db:5432/${POSTGRES_DB:-rao}
      RAO_REDIS_URL: redis://redis:6379/0
      RAO_QUEUE_BACKEND: redis
      RAO_QUEUE_NAME: ${RAO_QUEUE_NAME:-rao:jobs}
      RAO_START_INPROCESS_WORKER: "false"
      RAO_WORKER_POLL_SECONDS: ${RAO_WORKER_POLL_SECONDS:-1.0}
      RAO_SOLVER_TIME_LIMIT_SECONDS: ${RAO_SOLVER_TIME_LIMIT_SECONDS:-300}
      RAO_SOLVER_SEED: ${RAO_SOLVER_SEED:-42}
      RAO_HORIZON_EXTENSION_WEEKS: ${RAO_HORIZON_EXTENSION_WEEKS:-6}
      # Empty selects the fallback oracle. The official validator is NOT shipped;
      # put it in deploy/validator and point this at its container path.
      RAO_VALIDATOR_COMMAND: ${RAO_VALIDATOR_COMMAND:-}
    volumes:
      # Optional official validator, mounted read-only in the worker only.
      # The image does not contain a validator.
      - ./validator:/opt/validator:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app
      - ./web.vite.config.ts:/app/vite.compose.config.ts:ro
      - rao-web-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --config vite.compose.config.ts"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rao-db-data:
  rao-redis-data:
  rao-web-node-modules:
